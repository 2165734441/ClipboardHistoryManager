name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build and test
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
          dotnet run -c Release --no-build -- --self-test
          dotnet run -c Release --no-build -- --clipboard-self-test
          dotnet run -c Release --no-build -- --popup-drag-self-test

      - name: Publish Windows x64
        shell: pwsh
        run: .\build-release.ps1

      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path .\dist\ClipboardHistoryManager-win-x64\* -DestinationPath .\dist\ClipboardHistoryManager-win-x64.zip -Force

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: .\dist\ClipboardHistoryManager-win-x64.zip
